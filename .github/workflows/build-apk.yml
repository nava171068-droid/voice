name: Build APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repo root"
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p _project
          unzip -q -o "$ZIP" -d _project
          SETTINGS=$(find _project -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on runner)
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MicClips-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
